name: Bug report
description: ziproj crashed, gave a wrong result, or behaved differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real secret, token or private file here.** Use fake values in the same format.
        If a secret got past ziproj, report it privately instead: Security tab → Report a vulnerability.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what happened instead.
      placeholder: |
        ziproj -r ~/Code/my-app
        Expected ..., but ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest project layout that reproduces it
      description: A short list of files and folders (names and fake contents) is ideal.
      render: text
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The terminal output, with any private paths or names removed.
      render: text
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Paste the output of the command below.
      value: |
        ziproj --version; uname -sr; bash --version | head -1; gitleaks version; jq --version; git --version
      render: text
    validations:
      required: true
