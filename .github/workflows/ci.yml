name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck mandoc zsh fish
      - run: make lint

  test:
    name: test (${{ matrix.os }}, gitleaks ${{ matrix.gitleaks && 'on' || 'off' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned: its gitleaks package (8.16, no `dir` command) keeps the
        # fallback code path tested; macOS gets the current Homebrew release.
        os: [ubuntu-24.04, macos-latest]
        gitleaks: [true, false]
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks and jq (Ubuntu)
        if: matrix.gitleaks && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gitleaks jq

      - name: Install gitleaks and jq (macOS)
        if: matrix.gitleaks && runner.os == 'macOS'
        run: brew install gitleaks jq

      - name: Tool versions
        run: |
          bash --version | head -1
          /bin/bash --version | head -1
          zip -v | sed -n 2p
          gitleaks version 2>/dev/null || echo "gitleaks: not installed"

      # On macOS, `make test` runs ziproj with /bin/bash (bash 3.2).
      - run: make test
